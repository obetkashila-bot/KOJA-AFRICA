name: KOJA AFRICA Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: koja-africa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build release AAB
        if: ${{ secrets.KOJA_KEYSTORE_BASE64 != '' && secrets.KOJA_KEYSTORE_PASSWORD != '' && secrets.KOJA_KEY_ALIAS != '' && secrets.KOJA_KEY_PASSWORD != '' }}
        env:
          KOJA_KEYSTORE_BASE64: ${{ secrets.KOJA_KEYSTORE_BASE64 }}
          KOJA_KEYSTORE_PASSWORD: ${{ secrets.KOJA_KEYSTORE_PASSWORD }}
          KOJA_KEY_ALIAS: ${{ secrets.KOJA_KEY_ALIAS }}
          KOJA_KEY_PASSWORD: ${{ secrets.KOJA_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KOJA_KEYSTORE_BASE64" | base64 --decode > koja-release.keystore
          cat > keystore.properties <<PROPS
          storeFile=koja-release.keystore
          storePassword=$KOJA_KEYSTORE_PASSWORD
          keyAlias=$KOJA_KEY_ALIAS
          keyPassword=$KOJA_KEY_PASSWORD
          PROPS
          ./gradlew bundleRelease

      - name: Upload release AAB
        if: ${{ secrets.KOJA_KEYSTORE_BASE64 != '' && secrets.KOJA_KEYSTORE_PASSWORD != '' && secrets.KOJA_KEY_ALIAS != '' && secrets.KOJA_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: koja-africa-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
