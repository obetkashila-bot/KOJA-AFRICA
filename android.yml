name: KOJA AFRICA Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KOJA production
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor with KOJA production
        run: npx cap sync android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload KOJA APK
        uses: actions/upload-artifact@v4
        with:
          name: koja-africa-production-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build signed release APK when signing secrets exist
        if: ${{ secrets.KOJA_KEYSTORE_BASE64 != '' && secrets.KOJA_KEYSTORE_PASSWORD != '' && secrets.KOJA_KEY_ALIAS != '' && secrets.KOJA_KEY_PASSWORD != '' }}
        env:
          KOJA_KEYSTORE_BASE64: ${{ secrets.KOJA_KEYSTORE_BASE64 }}
          KOJA_KEYSTORE_PASSWORD: ${{ secrets.KOJA_KEYSTORE_PASSWORD }}
          KOJA_KEY_ALIAS: ${{ secrets.KOJA_KEY_ALIAS }}
          KOJA_KEY_PASSWORD: ${{ secrets.KOJA_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KOJA_KEYSTORE_BASE64" | base64 --decode > koja-release.keystore
          cat > keystore.properties <<PROPS
          storeFile=koja-release.keystore
          storePassword=$KOJA_KEYSTORE_PASSWORD
          keyAlias=$KOJA_KEY_ALIAS
          keyPassword=$KOJA_KEY_PASSWORD
          PROPS
          ./gradlew assembleRelease

      - name: Upload signed release APK
        if: ${{ secrets.KOJA_KEYSTORE_BASE64 != '' && secrets.KOJA_KEYSTORE_PASSWORD != '' && secrets.KOJA_KEY_ALIAS != '' && secrets.KOJA_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: koja-africa-production-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
