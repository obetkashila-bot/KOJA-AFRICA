name: Build KOJA AFRICA Native APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build installable APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk KOJA-AFRICA-Standalone.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KOJA-AFRICA-Standalone-APK
          path: KOJA-AFRICA-Standalone.apk
